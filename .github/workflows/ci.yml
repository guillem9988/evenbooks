name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same Postgres and Redis as local development (docker-compose.yml).
      - name: Start Postgres and Redis
        run: docker compose up -d --wait postgres redis
      # MinIO no longer publishes public images, so CI uses SeaweedFS as the S3-compatible store
      # on the same port and bucket as .env.example.
      - name: Start S3 (SeaweedFS)
        env:
          AWS_ACCESS_KEY_ID: matchinvoice
          AWS_SECRET_ACCESS_KEY: matchinvoice-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d --name s3 -p 59000:8333 chrislusf/seaweedfs server -s3 -dir=/data
          for attempt in $(seq 1 30); do
            if aws --endpoint-url http://localhost:59000 s3 mb s3://matchinvoice; then exit 0; fi
            sleep 2
          done
          docker logs s3
          exit 1
      - run: cp .env.example .env
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web · lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
