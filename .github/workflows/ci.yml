name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same Postgres, Redis and S3 (SeaweedFS) as local development (docker-compose.yml).
      - name: Start services
        run: |
          docker compose up -d --wait postgres redis
          docker compose up -d s3
          docker compose run --rm s3-init
      - run: cp .env.example .env
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web · lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npx tsc --noEmit
      - run: npm run build
