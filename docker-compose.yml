# Local infrastructure for MatchInvoice.
# Host ports are intentionally uncommon: Postgres 54329, Redis 63799,
# S3 API (SeaweedFS) 59000.
# pg_trgm does not need shared_preload_libraries. Extensions are created
# by the Prisma migration (CREATE EXTENSION), not by the Postgres command.

name: matchinvoice

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: matchinvoice
      POSTGRES_PASSWORD: matchinvoice
      POSTGRES_DB: matchinvoice
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchinvoice -d matchinvoice"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63799:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # S3-compatible object storage. MinIO no longer publishes public images, so local development
  # uses SeaweedFS (same as CI). Any access key works locally; .env.example uses matchinvoice.
  s3:
    image: chrislusf/seaweedfs
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "59000:8333"
    volumes:
      - s3_data:/data
    restart: unless-stopped

  # Creates the matchinvoice bucket once S3 answers, then exits 0. Not a long-running service.
  s3-init:
    image: amazon/aws-cli
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: matchinvoice
      AWS_SECRET_ACCESS_KEY: matchinvoice-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          aws --endpoint-url http://s3:8333 s3 mb s3://matchinvoice 2>/dev/null && exit 0
          aws --endpoint-url http://s3:8333 s3 ls s3://matchinvoice >/dev/null 2>&1 && exit 0
          sleep 2
        done
        exit 1
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  s3_data:
